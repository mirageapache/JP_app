<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>そ — 日語練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .hero { display: flex; align-items: center; gap: var(--sp-5); }
  .hero .big { font-size: 7rem; line-height: 1; }
  .order-box { position: relative; width: 168px; aspect-ratio: 1; flex: none; border: 1.5px solid var(--c-line); border-radius: var(--r-md); background: var(--c-surface); }
  .order-box::before, .order-box::after { content: ""; position: absolute; pointer-events: none; }
  .order-box::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--c-grid); }
  .order-box::after { top: 50%; left: 0; right: 0; border-top: 1px dashed var(--c-grid); }
  .order-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .variant { display: flex; align-items: center; gap: var(--sp-3); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="icon-btn" href="kana-chart.html" aria-label="返回"><svg class="i"><use href="#i-chev-l"/></svg></a>
    <h1 class="topbar__title">さ行</h1>
    <button class="icon-btn" type="button" aria-label="播放讀音"><svg class="i"><use href="#i-volume"/></svg></button>
  </header>

  <main class="page" style="gap:var(--sp-5)">
    <!-- 字與筆順 -->
    <section class="hero">
      <div class="order-box">
        <svg viewBox="0 0 109 109" class="stroke-order" id="order" data-autoplay-strokes aria-label="そ 的筆順動畫">
          <path class="s" d="M38 24 C47 23 56 21 64 20 C56 30 47 38 38 46 C52 44 66 42 80 41 C66 50 54 58 52 70 C50 82 58 90 72 88"/>
          <text x="33" y="22">1</text>
        </svg>
      </div>
      <div class="stack" style="gap:var(--sp-2)">
        <div class="big ja-display" lang="ja">そ</div>
        <div class="row" style="gap:var(--sp-2)"><strong>so</strong><span class="faint small">· 1 筆</span></div>
        <button class="btn btn--secondary btn--sm" type="button" onclick="playStrokeOrder(document.getElementById('order'))"><svg class="i sm"><use href="#i-play"/></svg>重播筆順</button>
      </div>
    </section>

    <!-- 筆畫版本 -->
    <section class="stack">
      <h2 class="section-title">筆畫版本<span class="caption faint">此字有其他常見寫法</span></h2>
      <ul class="list" role="radiogroup" aria-label="選擇筆畫版本">
        <li><label class="list-row">
          <div class="list-row__main"><div class="list-row__title">一筆寫法</div><div class="list-row__sub">上方短橫與下方連在一起（預設）</div></div>
          <input type="radio" name="variant" checked style="width:20px;height:20px;accent-color:var(--c-primary)">
        </label></li>
        <li><label class="list-row">
          <div class="list-row__main"><div class="list-row__title">兩筆寫法</div><div class="list-row__sub">上方短橫分開寫</div></div>
          <input type="radio" name="variant" style="width:20px;height:20px;accent-color:var(--c-primary)">
        </label></li>
      </ul>
      <p class="small faint" style="padding:0 var(--sp-1)">之後的手寫判定會依你選的版本。</p>
    </section>

    <!-- 自由練習 -->
    <section class="stack">
      <div class="row row--between">
        <h2 class="section-title" style="padding:0">自由練習</h2>
        <div class="segmented" style="width:150px">
          <button type="button" aria-pressed="true" id="tTrace">描摹</button>
          <button type="button" aria-pressed="false" id="tBlank">空白</button>
        </div>
      </div>
      <div class="writing-box" data-writing id="box">
        <div class="ghost" lang="ja" id="ghost">そ</div>
        <canvas aria-label="書寫區"></canvas>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn btn--secondary btn--sm" type="button" onclick="box.writing.undo()"><svg class="i sm"><use href="#i-undo"/></svg>復原</button>
        <button class="btn btn--secondary btn--sm" type="button" onclick="box.writing.clear()"><svg class="i sm"><use href="#i-trash"/></svg>清除</button>
      </div>
    </section>

    <!-- 學習狀態 -->
    <section class="stack">
      <h2 class="section-title">學習狀態</h2>
      <ul class="list">
        <li class="list-row"><div class="list-row__main">讀音</div><span class="badge badge--ok">已熟</span><span class="small faint num" style="width:76px;text-align:right">11/12 複習</span></li>
        <li class="list-row"><div class="list-row__main">書寫</div><span class="badge badge--shu">弱點</span><span class="small faint num" style="width:76px;text-align:right">明天複習</span></li>
      </ul>
    </section>

    <section class="banner">
      <svg class="i sm"><use href="#i-shuffle"/></svg>
      <div lang="ja">容易和 <strong style="display:inline">ろ</strong>、片假名 <strong style="display:inline">ソ</strong> 混淆 <a href="session-recognize.html">· 對照練習</a></div>
    </section>
  </main>
  <p class="mock-note">筆順路徑為示意，正式版使用 KanjiVG 資料。田字格可直接書寫。</p>
</div>
<script src="assets/mock.js"></script>
<script>
  const ghost = document.getElementById('ghost');
  document.getElementById('tTrace').addEventListener('click', () => ghost.hidden = false);
  document.getElementById('tBlank').addEventListener('click', () => ghost.hidden = true);
</script>
</body>
</html>
