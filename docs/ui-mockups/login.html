<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>登入 — 日語練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="icon-btn" href="onboarding.html" aria-label="返回"><svg class="i"><use href="#i-chev-l"/></svg></a>
    <h1 class="topbar__title">登入</h1>
    <a class="btn btn--ghost btn--sm" href="home.html">稍後</a>
  </header>

  <main class="page" style="gap:var(--sp-6)">
    <section class="stack" style="gap:var(--sp-2)">
      <h2 style="font-size:var(--fs-title-lg)">同步你的學習紀錄</h2>
      <p class="muted">登入後紀錄會自動備份到雲端，換手機或資料被清除時都能還原。</p>
    </section>

    <form class="stack" style="gap:var(--sp-4)" onsubmit="event.preventDefault()">
      <div class="field">
        <label for="email">電子郵件</label>
        <div class="input"><svg class="i sm"><use href="#i-mail"/></svg><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com"></div>
      </div>
      <div class="field">
        <label for="pw">密碼</label>
        <div class="input"><svg class="i sm"><use href="#i-lock"/></svg><input id="pw" type="password" autocomplete="current-password" placeholder="至少 8 個字元"><button class="icon-btn" type="button" aria-label="顯示密碼" style="width:36px;height:36px"><svg class="i sm"><use href="#i-eye"/></svg></button></div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">登入</button>
      <div class="row row--between">
        <a class="btn btn--ghost btn--sm" href="#" style="padding:0">建立帳號</a>
        <a class="btn btn--ghost btn--sm" href="#" style="padding:0">忘記密碼</a>
      </div>
    </form>

    <div class="banner">
      <svg class="i sm"><use href="#i-info"/></svg>
      <div>不登入也能使用，紀錄只會存在這台裝置。可以隨時在設定中登入。</div>
    </div>
  </main>
</div>
<script src="assets/mock.js"></script>
</body>
</html>
