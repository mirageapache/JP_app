<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>UI 範例總覽 — 日語練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { background: var(--c-surface-2); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: var(--sp-8) var(--sp-6) var(--sp-10); }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-8); }
  .head h1 { font-size: 1.75rem; }
  .group { margin-bottom: var(--sp-10); }
  .group h2 { font-size: var(--fs-title); margin-bottom: var(--sp-4); display: flex; align-items: center; gap: var(--sp-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-8) var(--sp-6); }
  .shot { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
  .phone {
    --w: 390px; --h: 844px; --s: .7;
    width: calc(var(--w) * var(--s) + 16px); height: calc(var(--h) * var(--s) + 16px);
    padding: 8px; border-radius: 44px; background: #111; box-shadow: var(--shadow-float);
  }
  .screen { width: calc(var(--w) * var(--s)); height: calc(var(--h) * var(--s)); border-radius: 36px; overflow: hidden; background: var(--c-paper); }
  .screen iframe { width: var(--w); height: var(--h); border: 0; transform: scale(var(--s)); transform-origin: 0 0; }
  .shot__label { display: flex; align-items: center; gap: var(--sp-2); font-weight: 600; }
  .shot__label a { font-weight: 400; font-size: var(--fs-small); }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="stack" style="gap:var(--sp-1)">
      <h1>日語練習帳 · UI 範例總覽</h1>
      <p class="muted">設計規範見 <code>design-system.md</code>。每個畫面都可點選互動，或另開新分頁以實際尺寸查看。</p>
    </div>
    <div class="segmented" id="theme" style="width:260px">
      <button type="button" aria-pressed="true" data-theme="">跟隨系統</button>
      <button type="button" aria-pressed="false" data-theme="light">淺色</button>
      <button type="button" aria-pressed="false" data-theme="dark">深色</button>
    </div>
  </header>
  <div id="groups"></div>
</div>
<script src="assets/mock.js"></script>
<script>
  const GROUPS = [
    ['開始使用', [['onboarding', '首次開啟引導', 'P1b'], ['login', '登入', 'P1.5']]],
    ['每日學習', [['home', '今日（首頁）', 'P1b'], ['session-recognize', '辨識題', 'P1b'], ['session-write', '手寫題', 'P1b'], ['session-vocab', '單字卡', 'P2'], ['session-summary', '學習完成', 'P1b']]],
    ['假名', [['kana-chart', '50 音表', 'P1a'], ['kana-detail', '假名詳細', 'P1a'], ['mark-known', '標記已會', 'P1b']]],
    ['單字與文法', [['vocab-list', '單字列表', 'P2'], ['vocab-detail', '單字詳細', 'P2'], ['grammar-list', '文法列表', 'P3'], ['grammar-detail', '文法詳細', 'P3'], ['quiz', '測驗', 'P3']]],
    ['統計與設定', [['stats', '統計', 'P3'], ['settings', '設定', 'P1b'], ['calibration', '手寫調校模式', 'P1a']]]
  ];
  let theme = '';
  function render() {
    const q = theme ? `?theme=${theme}` : '';
    document.getElementById('groups').innerHTML = GROUPS.map(([title, pages]) => `
      <section class="group"><h2>${title}</h2><div class="grid">
        ${pages.map(([file, name, phase]) => `
          <div class="shot">
            <div class="phone"><div class="screen"><iframe src="${file}.html${q}" title="${name}" loading="lazy"></iframe></div></div>
            <div class="shot__label">${name}<span class="badge badge--primary">${phase}</span><a href="${file}.html${q}" target="_blank">開新分頁</a></div>
          </div>`).join('')}
      </div></section>`).join('');
  }
  document.getElementById('theme').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    theme = b.dataset.theme;
    if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
    render();
  });
  render();
</script>
</body>
</html>
