<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>歡迎 — 日語練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .logo { position: relative; width: 120px; height: 120px; border-radius: 28px; background: var(--c-surface); border: 1.5px solid var(--c-line); display: grid; place-items: center; }
  .logo::before, .logo::after { content: ""; position: absolute; pointer-events: none; }
  .logo::before { left: 50%; top: 12px; bottom: 12px; border-left: 1px dashed var(--c-grid); }
  .logo::after { top: 50%; left: 12px; right: 12px; border-top: 1px dashed var(--c-grid); }
  .logo span { position: relative; font-family: var(--font-ja-display); font-size: 72px; line-height: 1; font-weight: 600; }
  .logo i { position: absolute; right: 18px; bottom: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--c-shu); }
  .ios-icon { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--c-surface-2); vertical-align: middle; margin: 0 2px; color: var(--c-primary); }
  .ios-icon svg { width: 16px; height: 16px; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-line); }
  .dots i.on { width: 18px; border-radius: 3px; background: var(--c-primary); }
</style>
</head>
<body>
<div class="app">
  <main class="page" style="padding-top:calc(var(--safe-top) + var(--sp-10));gap:var(--sp-6)">
    <section class="stack" style="align-items:center;text-align:center;gap:var(--sp-3)">
      <div class="logo" aria-hidden="true"><span lang="ja">あ</span><i></i></div>
      <h1 style="font-size:var(--fs-title-lg)">日語練習帳</h1>
      <p class="muted">每天 10 分鐘，用手寫記住日文</p>
    </section>

    <section class="card stack" style="gap:var(--sp-4)">
      <h2 style="font-size:var(--fs-callout)">先加入主畫面</h2>
      <p class="small muted">從主畫面開啟才能離線使用，學習紀錄也比較不會被系統清除。</p>
      <ol class="steps">
        <li><div>點 Safari 下方的分享按鈕<span class="ios-icon"><svg class="i"><use href="#i-share"/></svg></span></div></li>
        <li><div>往下滑，選<span class="ios-icon"><svg class="i"><use href="#i-plus-sq"/></svg></span>「加入主畫面」</div></li>
        <li><div>回到主畫面，點「日語練習帳」圖示開啟</div></li>
      </ol>
    </section>

    <div class="banner banner--warn">
      <svg class="i sm"><use href="#i-alert"/></svg>
      <div><strong>刪除主畫面圖示，會一併刪除學習紀錄</strong>登入帳號後，紀錄會自動同步到雲端，換手機也能還原。</div>
    </div>

    <div class="stack">
      <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
      <a class="btn btn--primary btn--lg btn--block" href="login.html">我已經從主畫面開啟</a>
      <a class="btn btn--ghost btn--block" href="home.html">先在瀏覽器裡看看</a>
    </div>
  </main>
</div>
<script src="assets/mock.js"></script>
</body>
</html>
